server:
  port: 8081

spring:
  application:
    name: appointment-service
  config:
    import: optional:configserver:http://localhost:8888
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/appointment_db
    username: ${DB_USERNAME:appt_user}
    password: ${DB_PASSWORD:appt_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    instances:
      technicianService:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    instances:
      technicianService:
        timeout-duration: 3s

jwt:
  secret: ${JWT_SECRET:repairWorkshopSuperSecretKeyForJWTTokenGeneration2026}
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    com.repairworkshop: DEBUG
    org.springframework.security: DEBUG